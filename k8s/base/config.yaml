# Settings shared by the applications. Nothing secret belongs here (see secrets.yaml).
# Cluster addresses are Service names: inside the cluster "postgres", "kafka" and "keycloak" resolve to the right pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Tokens say they were issued by localhost:8180 (Keycloak's fixed host name, see keycloak.yaml). The services check
  # that name, but fetch the signing keys and tokens through the cluster address.
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ledger
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8180/realms/ledger/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8180/realms/ledger/protocol/openid-connect/token
  # (MANAGEMENT_SERVER_ADDRESS is set per service, in each Deployment.)
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  # Web origins allowed to call the APIs from a browser (the UI dev server and the containerised UI).
  APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8085
