# The web UI: nginx serving the compiled static files. It calls the APIs and Keycloak from the user's browser, not from
# inside the cluster, so it needs no database and no settings at run time.
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels: { app: ui }
spec:
  selector: { app: ui }
  ports:
    - { name: http, port: 8085, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels: { app: ui }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                      # the "nginx" user of the nginx-unprivileged image
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: ledger-ui                  # the tag is set by the overlay (kustomize "images")
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx writes its process id and temporary files here: the only writable path
      volumes:
        - name: tmp
          emptyDir: {}
