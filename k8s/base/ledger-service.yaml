# Ledger API. Two replicas are safe (the outbox relay uses SKIP LOCKED); one is the default to keep a laptop cluster light.
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  labels: { app: ledger-service }
spec:
  selector: { app: ledger-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: ops, port: 9080, targetPort: ops }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels: { app: ledger-service }
spec:
  replicas: 1
  # A new pod must be ready before an old one is removed, so a deployment never reduces capacity.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: ledger-service }
  template:
    metadata:
      labels: { app: ledger-service }
      annotations:
        # The convention many Prometheus setups use to find what to scrape.
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9080"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45     # time to finish in-flight requests after SIGTERM (Spring Boot shuts down gracefully)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                    # the "app" user created in docker/Dockerfile
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ledger-service
          image: ledger-service                     # the tag is set by the overlay (kustomize "images")
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }, { name: ops, containerPort: 9080 }]
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            # The operations port must listen on the pod's network address so the kubelet (probes) and Prometheus can reach it.
            - { name: MANAGEMENT_SERVER_ADDRESS, value: 0.0.0.0 }
            - { name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/ledger }
            - { name: SPRING_DATASOURCE_USERNAME, value: ledger }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: db-password } }
            - { name: OUTBOX_RELAY_ENABLED, value: "true" }
          # Startup: give the JVM time to boot before the other probes begin. Liveness: restart the container if it is
          # stuck (checks nothing outside the process). Readiness: send traffic only while the service can use its database.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: ops }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: ops }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: ops }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }      # no CPU limit: throttling slows JVM start-up
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # the only writable path
      volumes:
        - name: tmp
          emptyDir: {}
