# Kafka consumer. It has no business API; its one HTTP port serves only health and metrics.
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: { app: notification-service }
spec:
  selector: { app: notification-service }
  ports:
    - { name: ops, port: 8083, targetPort: ops }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app: notification-service }
spec:
  replicas: 1
  # A new pod must be ready before an old one is removed, so a deployment never reduces capacity.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
      annotations:
        # The convention many Prometheus setups use to find what to scrape.
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45     # time to finish in-flight requests after SIGTERM (Spring Boot shuts down gracefully)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                    # the "app" user created in docker/Dockerfile
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification-service
          image: notification-service                     # the tag is set by the overlay (kustomize "images")
          imagePullPolicy: IfNotPresent
          ports: [{ name: ops, containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - { name: NOTIFICATIONS_DB_URL, value: jdbc:postgresql://postgres:5432/notifications }
            - { name: NOTIFICATIONS_DB_USER, value: ledger }
            - name: NOTIFICATIONS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: db-password } }
            - { name: SERVER_ADDRESS, value: 0.0.0.0 }
          # Startup: give the JVM time to boot before the other probes begin. Liveness: restart the container if it is
          # stuck (checks nothing outside the process). Readiness: send traffic only while the service can use its database.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: ops }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: ops }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: ops }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }      # no CPU limit: throttling slows JVM start-up
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # the only writable path
      volumes:
        - name: tmp
          emptyDir: {}
