# Trace storage and UI (in memory, local development only). The applications send traces to jaeger:4318 (OTLP over HTTP).
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app: jaeger }
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.8.0
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            tcpSocket: { port: ui }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: ui }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
