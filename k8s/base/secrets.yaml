# DEVELOPMENT VALUES ONLY. A Kubernetes Secret is base64-encoded, not encrypted, and this file is in Git.
# Real deployments create secrets outside Git (a secret manager such as Azure Key Vault, synced into the cluster).
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
type: Opaque
stringData:
  db-password: ledger
  trading-client-secret: trading-service-secret
  keycloak-admin-password: admin
