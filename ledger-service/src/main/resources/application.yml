spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger

  batch:
    job:
      enabled: false            # jobs run when triggered (API or schedule), never at startup
    jdbc:
      initialize-schema: always # Spring Batch's own metadata tables (BATCH_*); existing tables are left alone
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true   # trace context travels in the Kafka message headers
    producer:
      acks: all                 # wait for the broker to confirm before we mark an event published
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest   # used by tests; this service itself only produces
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are validated against Keycloak (docker compose). Discovery happens on the first request, not at startup.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ledger}

ledger:
  nightly-close:
    # Cron (UTC) for closing the previous day automatically. "-" disables it; the admin API still works.
    # Example: "0 30 0 * * *" runs at 00:30 UTC every day.
    cron: ${NIGHTLY_CLOSE_CRON:-}
  outbox:
    topic: ledger.transfers
    relay:
      # Needs Kafka (docker compose up -d). Off by default so the app starts without a broker.
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      interval-ms: 500
      batch-size: 100

management:
  server:
    # Operations endpoints (health, Prometheus) listen on their own port, so the API port serves only the API
    # and the operations port can stay private in production.
    port: 9080
    address: 127.0.0.1   # this computer only when run from the IDE; the compose file opens it to the compose network
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # nothing else is exposed (no env, beans, heapdump, loggers...)
  endpoint:
    health:
      probes:
        enabled: true                     # adds /actuator/health/liveness and /actuator/health/readiness
      show-components: always             # list which parts are UP or DOWN, without internal details
      group:
        readiness:
          include: readinessState,db      # "ready" means: can reach its database
  metrics:
    tags:
      application: ${spring.application.name}   # every metric says which service it came from
    distribution:
      percentiles-histogram:
        http.server.requests: true        # lets Prometheus compute p95/p99 latency
  tracing:
    sampling:
      probability: 0.0                    # off locally; docker compose (observability profile) sets it to 1.0
