server:
  port: 8084                         # the notification API (list and live stream); secured with bearer tokens
  address: 127.0.0.1                 # this computer only when run from the IDE; the compose file opens it to the compose network

spring:
  application:
    name: notification-service
  datasource:
    # Its own database (created by docker/postgres/init-notifications.sql), never the ledger's.
    url: ${NOTIFICATIONS_DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${NOTIFICATIONS_DB_USER:ledger}
    password: ${NOTIFICATIONS_DB_PASSWORD:ledger}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are validated against Keycloak. Discovery happens on the first request, not at startup.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ledger}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    producer:
      acks: all                     # used only to publish poison messages to the dead-letter topic
    template:
      observation-enabled: true
    listener:
      observation-enabled: true     # one span per consumed message, linked to the producer's trace

notification:
  topic: ledger.transfers
  stream:
    # A live stream is checked once, when it opens. Closing it every few minutes (about a token's lifetime) makes the browser
    # reconnect with a fresh token, so a signed-out or removed user does not keep receiving events.
    timeout-ms: 300000
    heartbeat-ms: 20000             # a comment line sent this often keeps proxies from closing an idle connection
  retry:
    interval-ms: 1000
    attempts: 3                     # retries before a message is sent to the dead-letter topic

management:
  server:
    # Operations endpoints (health, Prometheus) keep the port they always had, separate from the API port.
    port: 8083
    address: 127.0.0.1   # this computer only when run from the IDE; the compose file and the cluster open it
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # nothing else is exposed (no env, beans, heapdump, loggers...)
  endpoint:
    health:
      probes:
        enabled: true                     # adds /actuator/health/liveness and /actuator/health/readiness
      show-components: always             # list which parts are UP or DOWN, without internal details
      group:
        readiness:
          include: readinessState,db      # "ready" means: can reach its database
  metrics:
    tags:
      application: ${spring.application.name}   # every metric says which service it came from
    distribution:
      percentiles-histogram:
        http.server.requests: true        # lets Prometheus compute p95/p99 latency
  tracing:
    sampling:
      probability: 0.0                    # off locally; docker compose (observability profile) sets it to 1.0

app:
  cors:
    # Web origins allowed to call this API from a browser (comma-separated). Same setting as the other services.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
