# Prometheus pulls ("scrapes") metrics from every service on a timer. The services never push anything.
# The operations ports (9080, 9082, 8083) are reachable on the compose network only through these names.
global:
  scrape_interval: 5s        # short so demos react quickly; 15s to 60s is normal in production
  evaluation_interval: 5s    # how often the alert rules are checked

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ledger-service:9080"]

  - job_name: trading-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["trading-service:9082"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]
