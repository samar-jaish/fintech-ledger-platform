# Opens pull requests when dependencies have newer versions, so security fixes do not wait for someone to remember.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: weekly }
