name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch cancels the older run, so runners are not wasted on outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

jobs:
  # 1. Compile and run every unit and integration test (Testcontainers needs Docker, which the runner has).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports

  # 2. Build the three images, start the whole platform (plus Prometheus, Grafana and Jaeger) with Docker Compose and run
  #    real requests against it, including checks on health, metrics, dashboards and traces.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the platform
        run: docker compose --profile apps --profile observability up -d --build
      - name: Smoke test
        run: bash scripts/smoke-test.sh
        env:
          CHECK_OBSERVABILITY: 'true'
      - name: Show container logs when something failed
        if: failure()
        run: docker compose --profile apps --profile observability logs --no-color --tail 200
      - name: Stop the platform
        if: always()
        run: docker compose --profile apps --profile observability down -v

  # 2b. The same end-to-end check, but on Kubernetes: a kind cluster is created, the manifests in k8s/ are applied and the
  #     same smoke test runs against it. This proves the images, probes, Services and settings work in a cluster.
  #     It runs in parallel with the Compose smoke test and is not required for publishing images (yet).
  kubernetes:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ledger
          config: k8s/kind-config.yaml
      - name: Build the images and deploy to the cluster
        run: bash scripts/kind-up.sh
      - name: Smoke test
        run: bash scripts/smoke-test.sh
        env:
          CHECK_TRACING: 'true'
          NOTIFICATION_LOGS_CMD: kubectl -n ledger logs deploy/notification-service
      - name: Show cluster state when something failed
        if: failure()
        run: |
          kubectl -n ledger get pods -o wide
          kubectl -n ledger describe pods | tail -150
          for d in ledger-service trading-service notification-service keycloak kafka postgres; do
            echo "----- $d"; kubectl -n ledger logs "deploy/$d" --tail=80 2>&1 || kubectl -n ledger logs "statefulset/$d" --tail=80 2>&1 || true
          done

  # 3. Publish the images to GitHub's container registry, only for commits on master that passed everything above.
  images:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN push to ghcr.io; no personal access token is stored anywhere
    strategy:
      fail-fast: false
      matrix:
        module: [ledger-service, notification-service, trading-service]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
