name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch cancels the older run, so runners are not wasted on outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

jobs:
  # 1. Compile and run every unit and integration test (Testcontainers needs Docker, which the runner has).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports

  # 2. Build the three images, start the whole platform with Docker Compose and run real requests against it.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the platform
        run: docker compose --profile apps up -d --build
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Show container logs when something failed
        if: failure()
        run: docker compose --profile apps logs --no-color --tail 200
      - name: Stop the platform
        if: always()
        run: docker compose --profile apps down -v

  # 3. Publish the images to GitHub's container registry, only for commits on master that passed everything above.
  images:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN push to ghcr.io; no personal access token is stored anywhere
    strategy:
      fail-fast: false
      matrix:
        module: [ledger-service, notification-service, trading-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
