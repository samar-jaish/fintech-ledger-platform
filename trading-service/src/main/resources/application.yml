server:
  port: 8082

spring:
  application:
    name: trading-service
  datasource:
    # Its own database (created by docker/postgres/init-databases.sql), never the ledger's.
    url: ${TRADING_DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${TRADING_DB_USER:ledger}
    password: ${TRADING_DB_PASSWORD:ledger}
  http:
    client:
      connect-timeout: 2s       # applies to the ledger client: fail fast, the saga retries later
      read-timeout: 5s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms            # a slow Redis must never slow trading: give up quickly and use the provider
      connect-timeout: 200ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ledger}

ledger-client:
  base-url: ${LEDGER_BASE_URL:http://localhost:8080}
  token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/ledger/protocol/openid-connect/token}
  client-id: trading-service
  client-secret: ${TRADING_CLIENT_SECRET:trading-service-secret}   # local demo secret; real deployments inject it

  resilience:
    max-attempts: 3             # tries per ledger call (the first one included)
    initial-backoff: 200ms      # 200ms before the 2nd try, 400ms before the 3rd
    window-size: 10             # the breaker looks at the last 10 calls
    minimum-calls: 5            # and never opens before it has seen 5
    failure-rate-percent: 50    # opens when half of them failed
    open-duration: 10s          # then rejects calls for 10 seconds before testing the ledger again
    half-open-calls: 2

trading:
  recovery:
    initial-delay-ms: 10000
    interval-ms: 10000
    min-age-ms: 15000           # a pending trade is retried only after it has been pending this long

market:
  # simulated: seeded fake prices, no network (default)
  # replay:    prices recorded in our own database (real numbers, offline, repeatable)
  # live:      real vendors (needs FINNHUB_API_KEY and TWELVEDATA_API_KEY)
  # Switch without editing this file:  set MARKET_PROVIDER=live
  provider: ${MARKET_PROVIDER:simulated}
  cache:
    # Redis cache for quotes (docker compose up -d starts Redis). Off by default so the service runs without it.
    enabled: ${MARKET_CACHE_ENABLED:false}
    ttl: 5s
  simulated:
    seed: 42
    latency-ms: 0
    failure-rate: 0.0
  live:
    finnhub:
      base-url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_API_KEY:}
    twelvedata:
      base-url: https://api.twelvedata.com
      api-key: ${TWELVEDATA_API_KEY:}

management:
  server:
    # Operations endpoints (health, Prometheus) listen on their own port, so the API port serves only the API
    # and the operations port can stay private in production.
    port: 9082
    address: 127.0.0.1   # this computer only when run from the IDE; the compose file opens it to the compose network
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # nothing else is exposed (no env, beans, heapdump, loggers...)
  endpoint:
    health:
      probes:
        enabled: true                     # adds /actuator/health/liveness and /actuator/health/readiness
      show-components: always             # list which parts are UP or DOWN, without internal details
      group:
        readiness:
          include: readinessState,db      # "ready" means: can reach its database
  health:
    redis:
      enabled: ${MARKET_CACHE_ENABLED:false}   # Redis is optional (fail-open cache), so it only counts when the cache is on
  metrics:
    tags:
      application: ${spring.application.name}   # every metric says which service it came from
    distribution:
      percentiles-histogram:
        http.server.requests: true        # lets Prometheus compute p95/p99 latency
  tracing:
    sampling:
      probability: 0.0                    # off locally; docker compose (observability profile) sets it to 1.0

app:
  cors:
    # Web origins allowed to call this API from a browser (comma-separated). The default is the UI's local dev server
    # (npm run dev). The compose file and the Kubernetes config also add the containerised UI.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
